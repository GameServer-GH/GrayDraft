app:
  name: graydraft-gateway
  env: development

http:
  port: 18002

# Embedding 与重排走百炼。规划走 intern-s1-mini，回答走 intern-s2。
models:
  embedding:
    provider: dashscope
    model: text-embedding-v4
  llm_fast:
    provider: intern
    model: intern-s1-mini
  llm:
    provider: intern
    model: intern-s2
  rerank:
    provider: dashscope
    model: qwen3-rerank

embedding:
  dim: 1024
  # 配置 DASHSCOPE_API_KEY 后走百炼 Embedding API；无 Key 或 API 失败时可回退 pseudo
  fallback_local: true

llm:
  max_tokens: 4096
  temperature: 0.7
  fallback_local: false

rerank:
  fallback_local: false

providers:
  deepseek:
    enabled: true
    base_url: https://api.deepseek.com
    # api_key：环境变量 DEEPSEEK_API_KEY 优先，留空则用程序内加密密钥
  dashscope:
    enabled: true
    base_url: https://dashscope.aliyuncs.com/compatible-mode
    # api_key：环境变量 DASHSCOPE_API_KEY 优先，留空则用程序内加密密钥
  openai:
    enabled: false
    base_url: https://api.openai.com
    # api_key: OPENAI_API_KEY
  intern:
    enabled: true
    base_url: https://chat.intern-ai.org.cn/api/v1
    # api_key：环境变量 INTERN_API_KEY 优先，留空则用程序内加密密钥
