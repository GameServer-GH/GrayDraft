app:
  name: graydraft-core
  env: production

http:
  port: 18080

grpc:
  port: 19090

retrieval:
  default_top_k: 10
  max_top_k: 50
  rrf_constant_k: 60
  vector_weight: 0.5
  fulltext_weight: 0.5
  structured_vector_weight: 0.35
  semantic_4d_filter_enabled: true
  semantic_4d_llm_enabled: true
  semantic_4d_strict_filter: false
  semantic_4d_entity_strict: false
  rerank_skip_min_score: 0.78

database:
  host: ${DB_HOST}
  port: 5432
  name: graydraft_kb
  sslmode: require

redis:
  host: ${REDIS_HOST}
  port: 6379
  db: 0

nats:
  url: ${NATS_URL}
  enabled: true
  ugc_subject: graydraft.ugc.ingest
  jetstream:
    enabled: true
    stream: GRAYDRAFT_UGC
    subjects:
      - graydraft.ugc.ingest
    replicas: 1
    dlq_stream: GRAYDRAFT_UGC_DLQ
    dlq_subject: graydraft.ugc.dlq

answer_cache:
  enabled: true
  redis_enabled: true
  ttl_seconds: 1800
  l1_max_items: 5000

observability:
  metrics_enabled: true
  otel_enabled: true
  otel_endpoint: ""          # 生产由 OTEL_EXPORTER_OTLP_ENDPOINT 注入
  otel_service_name: graydraft-core

auth:
  admin_user: admin
  token_ttl_hours: 24
  # jwt_secret / admin_password via JWT_SECRET / ADMIN_PASSWORD env

cache:
  similarity_threshold: 0.95
  ttl_seconds: 7200
  entity_pool_ttl_seconds: 3600

model_gateway:
  url: ${MODEL_GATEWAY_URL}
  embedding_model: text-embedding-v4
  llm_model_fast: intern-s1-mini
  llm_model: intern-s2
  rerank_model: qwen3-rerank

ai_worker:
  url: ${AI_WORKER_URL}

global_index:
  auto_refresh_hours: 12
  refresh_concurrent: true

storage_tier:
  cold_after_days: 90
  exclude_cold_default: true

ragops:
  enabled: true
  strike_days: 3
  strike_threshold: 3
  quality_below: 0.45
  default_action: rechunk

multimodal:
  enabled: true
  base_url: https://chat.intern-ai.org.cn/api/v1
  vl_plus_model: internvl-latest
  vl_max_model: internvl-latest
  max_file_bytes: 12582912
  timeout_seconds: 120
  force_vlm_only: true
  chain_vlm_enabled: true
  doc_intel_enabled: false
  doc_intel_model: doc-ocr

taxonomy_evolve:
  enabled: true
  blueprint_enabled: true
  blueprint_validator_enabled: true
  backfill_batch_size: 80
  blueprint_min_docs: 5
  embed_align_min: 0.85
  label_birth_doc_count: 8
  candidate_promote_doc_count: 5
  compress_candidate_threshold: 20
  max_keywords_per_label: 10
  similarity_merge_min: 0.85
  similarity_distinct_max: 0.5
  llm_merge_enabled: true
  compress_enabled: true

ugc:
  sync_fallback: true
