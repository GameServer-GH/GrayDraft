global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: graydraft-core
    metrics_path: /metrics
    static_configs:
      - targets: ['core:18080']
  - job_name: graydraft-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:18001']
  - job_name: graydraft-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:18002']
