# GrayDraft 边界 TLS 终止 → graydraft_web（其内再反代 /api → graydraft）
# 证书：deploy/nginx/ssl/graydraft.com.pem；私钥由 make prod-up 写出

server {
    listen 80;
    server_name graydraft.com www.graydraft.com;
    server_tokens off;

    return 301 https://graydraft.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name graydraft.com www.graydraft.com;
    server_tokens off;

    ssl_certificate /etc/nginx/ssl/graydraft.com.pem;
    ssl_certificate_key /etc/nginx/ssl/graydraft.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/common/security.conf;

    client_max_body_size 100m;

    location / {
        proxy_pass http://graydraft_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
