syntax = "proto3";

package graydraft.worker;

option go_package = "github.com/graydraft/gen/go/worker;workerv1";

service ParsingService {
  rpc ParseDocument(ParseRequest) returns (ParseResponse);
}

message ParseRequest {
  string doc_id = 1;
  bytes content = 2;
  string mime_type = 3;
}

message ParseResponse {
  repeated string chunks = 1;
}
