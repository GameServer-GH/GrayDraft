resolver 127.0.0.11 valid=10s ipv6=off;

upstream graydraft {
    server graydraft:8787;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;

    client_max_body_size 100m;

    # 使用变量触发运行时 DNS 解析，避免 graydraft 重建后 IP 变更导致 502
    set $graydraft_upstream graydraft:8787;

    location /api/ {
        proxy_pass http://$graydraft_upstream;
        proxy_http_version 1.1;
        proxy_ignore_client_abort on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Graydraft-Workspace-Key $http_x_graydraft_workspace_key;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass http://$graydraft_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
